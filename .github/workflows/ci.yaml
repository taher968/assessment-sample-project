name: CI Pipeline
run-name: ci-pipeline

on:
  push:
    branches: 
  pull_request:
    branches: [main]

jobs:
    security:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install dependencies
              run: |
                go mod tidy
                go mod download

            - name: Install gosec
              run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

            - name: Run gosec
              run: gosec ./...
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install dependencies
              run: |
                go mod tidy
                go mod download

            - name: Build
              run: go build -o main -v ./...

            - name: Run tests
              run: go test ./...
