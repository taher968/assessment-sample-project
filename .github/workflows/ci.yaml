name: CI Pipeline
run-name: ci-pipeline

on:
  push:
    branches: 
  pull_request:
    branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Install dependencies
             run: |
                go mod tidy
                go mod download

            - name: Build
              run: go build -v ./...

            - name: Run tests
              run: go test ./...
